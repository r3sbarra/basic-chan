[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-chan"
version = "0.1.0"
description = "Daemonless, agent-native foundational framework for the -chan ecosystem."
readme = "README.md"
authors = [{ name = "r3sbarra", email = "25109979+r3sbarra@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["chan", "agent", "mcp", "daemonless", "framework", "sqlite-wal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/r3sbarra/basic-chan"
Repository = "https://github.com/r3sbarra/basic-chan"

dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "filelock>=3.12.0",
    "mcp>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
ai = [
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.15.0",
]

[project.scripts]
basic-chan = "basic_chan.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
